name: Ingestion Worker Deployment

on:
  push:
    branches: [main, develop]
    paths:
      - 'ingestion/**'
      - 'shared/**'
      - 'tests/**'
      - 'infra/pulumi/**'
      - '.github/workflows/ingestion.yml'

  workflow_dispatch:
    inputs:
      deploy_docker:
        description: 'Build and Push Docker Image as well?'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r ingestion/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        env:
          PYTHONPATH: .
          STORAGE_TYPE: local
        run: pytest tests/ingestion/ tests/shared/ -v --tb=short

  build-and-push:
    name: 🐳 Build & Push Ingestion
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      AWS_REGION: us-east-1
      PULUMI_STACK: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Pulumi
        uses: pulumi/setup-pulumi@v2

      - name: Get Repo URL
        id: pulumi-outputs
        working-directory: infra/pulumi
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          pip install -r requirements.txt
          pulumi login s3://minerva-infra-state
          echo "ingestion_repo=$(pulumi stack output ingestion_repo_url --stack ${{ env.PULUMI_STACK }})" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        if: github.event_name == 'push' || inputs.deploy_docker == true
        run: |
          REPO=${{ steps.pulumi-outputs.outputs.ingestion_repo }}
          SHA_TAG=${GITHUB_SHA::8}
          docker build -t ${REPO}:${SHA_TAG} -t ${REPO}:latest -f infra/docker/Dockerfile.ingestion .
          docker push ${REPO}:${SHA_TAG}
          docker push ${REPO}:latest

      - name: Pulumi Deploy
        working-directory: infra/pulumi
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          pip install -r requirements.txt
          pulumi login s3://minerva-infra-state
          
          # Inject secrets from GitHub
          pulumi config set sarvam_api_key "${{ secrets.SARVAM_API_KEY }}" --secret --stack ${{ env.PULUMI_STACK }}
          pulumi config set auth_secret "${{ secrets.AUTH_SECRET }}" --secret --stack ${{ env.PULUMI_STACK }}
          pulumi config set auth_google_id "${{ secrets.AUTH_GOOGLE_ID }}" --secret --stack ${{ env.PULUMI_STACK }}
          pulumi config set auth_google_secret "${{ secrets.AUTH_GOOGLE_SECRET }}" --secret --stack ${{ env.PULUMI_STACK }}
          
          # Deploy updated task definition (also handles worker updates)
          pulumi up --yes --stack ${{ env.PULUMI_STACK }}

